
<div id="recordings-lib" class="w-full h-full flex flex-col px-4 py-4 space-y-2 bg-white">
    <div class="heading font-display font-semibold text-xl text-ink">
        Recordings Library
    </div>
    <div class="flex items-center gap-2 text-sm text-text-body">
        <span>Saved to:</span>
        <code id="video-dir-path" class="font-mono bg-cream-dark px-2 py-1 rounded text-text-body">Loading...</code>
        <button id="open-folder-btn" class="text-navy hover:underline cursor-pointer transition-colors duration-200">Open Folder</button>
    </div>
    <div class="all-recordings-table bg-cream-dark w-full h-full px-2 py-2 flex flex-col gap-4 overflow-hidden">
        <div class="wrapper flex flex-col gap-2">
                <label class="font-semibold text-xl text-ink">Search</label>
                <div class="flex flex-wrap items-end gap-3">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-text-dim" for="search-barcode">Barcode</label>
                        <input id="search-barcode" class="font-mono bg-white border-1 border-navy/30 outline-none rounded px-2 py-1" type="text" name="search-barcode" placeholder="Enter barcode text"/>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-text-dim" for="search-mode">Match</label>
                        <select id="search-mode" class="bg-white border-1 border-navy/30 outline-none rounded px-2 py-1 cursor-pointer">
                            <option value="contains">Contains</option>
                            <option value="startsWith">Starting with</option>
                            <option value="endsWith">Ending with</option>
                            <option value="exact">Exact match</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-text-dim" for="search-date-from">Date From</label>
                        <input id="search-date-from" class="bg-white border-1 border-navy/30 outline-none rounded px-2 py-1" type="date"/>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-text-dim" for="search-date-to">Date To</label>
                        <input id="search-date-to" class="bg-white border-1 border-navy/30 outline-none rounded px-2 py-1" type="date"/>
                    </div>
                    <button id="search-btn" class="border border-navy rounded-md flex items-center justify-center px-4 py-1.5 text-ink bg-gold gap-2 cursor-pointer transition-colors duration-200 hover:bg-gold-deep">
                        <svg fill="#0D0D0D" height="16px" width="16px" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 488.4 488.4" xml:space="preserve"><g id="SVGRepo_bgCarrier" stroke-width="1"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g> <g> <path d="M0,203.25c0,112.1,91.2,203.2,203.2,203.2c51.6,0,98.8-19.4,134.7-51.2l129.5,129.5c2.4,2.4,5.5,3.6,8.7,3.6 s6.3-1.2,8.7-3.6c4.8-4.8,4.8-12.5,0-17.3l-129.6-129.5c31.8-35.9,51.2-83,51.2-134.7c0-112.1-91.2-203.2-203.2-203.2 S0,91.15,0,203.25z M381.9,203.25c0,98.5-80.2,178.7-178.7,178.7s-178.7-80.2-178.7-178.7s80.2-178.7,178.7-178.7 S381.9,104.65,381.9,203.25z"></path> </g> </g> </g></svg>
                        Search</button>
                    <button id="clear-search-btn" class="hidden border border-navy/40 rounded-md px-4 py-1.5 text-text-body cursor-pointer transition-colors duration-200 hover:bg-white">Clear</button>
                </div>
            </div>
        <hr class="my-2 border-t border-gold/60 bg-transparent"/>
        <div class="table flex-1 overflow-y-auto bg-white rounded">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="font-mono text-text-dim text-sm border-b border-cream-dark sticky top-0 bg-white">
                        <th class="py-2 px-3">Barcode</th>
                        <th class="py-2 px-3">Filename</th>
                        <th class="py-2 px-3">Date</th>
                        <th class="py-2 px-3">Size (MB)</th>
                        <th class="py-2 px-3">Actions</th>
                    </tr>
                </thead>
                <tbody id="records-tbody" class="ecom-fade-in text-text-body"></tbody>
            </table>
            <p id="no-records-msg" class="hidden text-center text-text-dim py-8">No recordings yet. Scan a barcode on the Dashboard tab to create one.</p>
        </div>
    </div>
</div>
