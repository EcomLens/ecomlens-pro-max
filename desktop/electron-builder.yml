appId: com.ecomlense.app
productName: EcomLens
copyright: Copyright © 2026 Jinzy / Net Brands Solutions. All Rights Reserved.
npmRebuild: false
directories:
  output: release
files:
  - src/**
  - node_modules/**
  - package.json
  - build/**
  - main.js
  - preload.js
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
