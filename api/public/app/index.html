<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcomLens Web | Login</title>
<link rel="stylesheet" href="/brand.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card {
    width: 100%; max-width: 380px; background: #fff; border-radius: 14px;
    box-shadow: 0 1px 2px rgba(13,13,13,0.04), 0 8px 24px rgba(13,13,13,0.08);
    padding: 32px;
  }
  .wordmark { font-family: "Fraunces", serif; font-weight: 600; font-size: 20px; margin-bottom: 22px; }
  .wordmark span { color: var(--navy); }
  .tabs { display: flex; gap: 22px; margin-bottom: 20px; border-bottom: 1px solid var(--cream-dark); }
  .tab { padding-bottom: 10px; font-size: 14px; font-weight: 600; color: var(--text-dim); border-bottom: 2px solid transparent; cursor: pointer; background: none; border-left: none; border-right: none; border-top: none; font-family: inherit; }
  .tab.active { color: var(--ink); border-bottom-color: var(--gold); }
  form { display: flex; flex-direction: column; }
  .switch-line { margin-top: 16px; font-size: 13.5px; color: var(--text-dim); text-align: center; }
  .switch-line a { color: var(--navy); cursor: pointer; text-decoration: underline; }
  .tagline { font-family: "Fraunces", serif; font-style: italic; font-size: 13px; color: var(--text-dim); text-align: center; margin-top: 20px; }
</style>
</head>
<body>

<div class="auth-card">
  <div class="wordmark">EcomLens<span>.</span> Web</div>

  <div class="tabs">
    <button class="tab active" id="loginTab" type="button">Log in</button>
    <button class="tab" id="signupTab" type="button">Sign up</button>
  </div>

  <form id="loginForm">
    <label class="field-label" for="loginEmail">Email</label>
    <input class="field-input" id="loginEmail" type="email" autocomplete="email" />
    <label class="field-label" for="loginPassword">Password</label>
    <input class="field-input" id="loginPassword" type="password" autocomplete="current-password" />
    <p id="loginError" class="error-text hidden"></p>
    <button class="btn btn-primary" id="loginBtn" type="button" style="margin-top:22px;">Log in</button>
    <p class="switch-line">New here? <a id="goSignup">Create an account</a></p>
  </form>

  <form id="signupForm" class="hidden">
    <label class="field-label" for="signupName">Name</label>
    <input class="field-input" id="signupName" type="text" autocomplete="name" />
    <label class="field-label" for="signupEmail">Email</label>
    <input class="field-input" id="signupEmail" type="email" autocomplete="email" />
    <label class="field-label" for="signupPassword">Password</label>
    <input class="field-input" id="signupPassword" type="password" autocomplete="new-password" />
    <p id="signupError" class="error-text hidden"></p>
    <button class="btn btn-primary" id="signupBtn" type="button" style="margin-top:22px;">Create account</button>
    <p class="switch-line">Already have an account? <a id="goLogin">Log in</a></p>
  </form>

  <p class="tagline">Catch the leaks, before they cost you.</p>
</div>

<script>
const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");
const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");

function showLogin() {
  loginForm.classList.remove("hidden");
  signupForm.classList.add("hidden");
  loginTab.classList.add("active");
  signupTab.classList.remove("active");
}
function showSignup() {
  signupForm.classList.remove("hidden");
  loginForm.classList.add("hidden");
  signupTab.classList.add("active");
  loginTab.classList.remove("active");
}
loginTab.addEventListener("click", showLogin);
signupTab.addEventListener("click", showSignup);
document.getElementById("goSignup").addEventListener("click", showSignup);
document.getElementById("goLogin").addEventListener("click", showLogin);

// Already logged in? Skip straight to the scanning page.
if (localStorage.getItem("ecomlensToken")) {
  window.location.href = "/app/scan.html";
}

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errorEl = document.getElementById("loginError");
  errorEl.classList.add("hidden");

  const res = await fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const body = await res.json();

  if (!body.status) {
    errorEl.textContent = body.msg || "Login failed";
    errorEl.classList.remove("hidden");
    return;
  }

  localStorage.setItem("ecomlensToken", body.data.token);
  localStorage.setItem("ecomlensUser", JSON.stringify({ id: body.data.id, email: body.data.email, name: body.data.name }));
  window.location.href = "/app/scan.html";
});

document.getElementById("signupBtn").addEventListener("click", async () => {
  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  const errorEl = document.getElementById("signupError");
  errorEl.classList.add("hidden");

  const res = await fetch("/api/auth/signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email, password }),
  });
  const body = await res.json();

  if (!body.status) {
    errorEl.textContent = body.msg || "Signup failed";
    errorEl.classList.remove("hidden");
    return;
  }

  showLogin();
  document.getElementById("loginEmail").value = email;
});
</script>
</body>
</html>
