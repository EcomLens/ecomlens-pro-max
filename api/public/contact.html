<style>
  body { max-width: 620px; margin: 0 auto; padding: 40px 24px 80px; line-height: 1.65; }
  .page-header { margin-bottom: 24px; }
  .back { display: inline-block; margin-top: 18px; font-size: 13px; text-decoration: none; color: var(--fg-muted); font-family: "IBM Plex Mono", monospace; }

  .card { border: 1px solid var(--line-strong); background: var(--bg-raised); border-radius: 10px; padding: 20px 24px; margin-top: 24px; }
  .card + .card { margin-top: 16px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-muted); margin-bottom: 4px; font-family: "IBM Plex Mono", monospace; }
